[project]
name = "esphome-configs"
version = "0.0.0"
description = "ESPHome device configurations"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "esphome>=2026.7.3",
]

[tool.uv]
# This repo holds YAML device configs, not an installable Python package.
package = false

# esphome hard-pins platformio==6.1.19, which declares "starlette >=0.19,<0.53".
# Every starlette below 1.3.1 carries unpatched advisories (GHSA/PYSEC-2026-161,
# -248, -249, -2280, -2281), so that cap makes a clean resolution impossible.
# starlette is imported only by platformio/home/* -- the `pio home` local web UI --
# which esphome never invokes for config/compile/upload/logs. Override the cap so
# the lockfile carries patched code instead of a suppressed alert.
# Trade-off: `pio home` is not expected to work under this override.
# Revisit once platformio relaxes its starlette bound.
override-dependencies = ["starlette>=1.3.1"]
