# Template for secrets.yaml.
#
# Copy this file to secrets.yaml in the repo root and fill in real values:
#
#   cp example.secrets.yaml secrets.yaml
#
# secrets.yaml is gitignored -- never commit it. This template holds
# placeholders only, so it is safe to keep in version control.

# --- Wi-Fi -------------------------------------------------------------
# Used by bme280.yaml and presence-node.yaml.
wifi_ssid: "YourNetwork"
wifi_password: "your-wifi-password"

# dht-only.yaml references the same network under older uppercase key
# names. Set these to the same values as wifi_ssid / wifi_password above
# unless that device is genuinely on a different network.
SSID: "YourNetwork"
SSID_PASS: "your-wifi-password"

# Password for the fallback hotspot each device brings up when it cannot
# reach Wi-Fi. Used by all three configs. Must be at least 8 characters.
AP_PASS: "fallback-hotspot-password"

# --- Home Assistant API ------------------------------------------------
# Base64-encoded 32-byte key for the encrypted native API. Used by all
# three configs. Generate one with:
#
#   openssl rand -base64 32
#
# You can reuse a single key across these devices, or give each device its
# own key -- Home Assistant prompts for it when adopting the device.
api_encryption_key: "REPLACE_ME_WITH_openssl_rand_base64_32"

# --- OTA ---------------------------------------------------------------
# Password required to push over-the-air firmware updates. Used by all
# three configs. Changing it means re-flashing over USB once.
ota_password: "your-ota-password"

# --- MQTT --------------------------------------------------------------
# Broker address for bme280.yaml. (dht-only.yaml still has its broker IP
# hardcoded in the config file.)
mqtt_broker: "192.168.10.214"

# Password for the MQTT "homeassistant" user. Used by bme280.yaml and
# dht-only.yaml for MQTT auth, despite the name.
hass_password: "your-mqtt-password"
